name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/ci_engine.py
      - run: ruff check python tests scripts examples setup.py
      - run: ruff format --check python tests scripts examples setup.py
      - run: python scripts/run_integration_tests.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/run_integration_tests.py --graphical
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          path: |
            .artifacts/editor-*.log
            dist/*
